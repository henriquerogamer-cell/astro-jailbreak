name: Build ASTRO-Jailbreak.pkg

on:
  push:
    branches: [dev/astro-jailbreak]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ASTRO source and artwork
        uses: actions/checkout@v4
      - name: Install .NET 10 and RAR extractor
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download public WebKit launcher base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference"
          curl -fL --retry 3 "https://raw.githubusercontent.com/ps5-payload-dev/websrv/bc336a9e61cc5a23dd8f71f5156b79c04d4f71f7/homebrew/IV9999-FAKE00000_00-HOMEBREWLOADER01.pkg" -o "$RUNNER_TEMP/reference/reference.pkg"
          test -s "$RUNNER_TEMP/reference/reference.pkg"
      - name: Fetch pinned PS5 package builder
        run: |
          git clone --filter=blob:none https://github.com/SvenGDK/LibProsperoPKG.git "$GITHUB_WORKSPACE/LibProsperoPKG"
          git -C "$GITHUB_WORKSPACE/LibProsperoPKG" checkout 748eabf1b7d17819528cabf367d8e27109d8fce3
      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          deeplink="https://cdn.jsdelivr.net/gh/henriquerogamer-cell/astro-jailbreak@${GITHUB_SHA}/index.html"
          dotnet run --configuration Release --project tools/pkg-builder/AstroPkgBuilder.csproj -- "$RUNNER_TEMP/reference/reference.pkg" "$GITHUB_WORKSPACE/dist" "$deeplink" "$GITHUB_WORKSPACE/assets/astro"
          test -s dist/ASTRO-Jailbreak.pkg
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Jailbreak-pkg
          path: dist/ASTRO-Jailbreak.pkg
          if-no-files-found: error
          retention-days: 30
