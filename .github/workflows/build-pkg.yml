name: Build ASTRO-Jailbreak.pkg

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ASTRO source and artwork
        uses: actions/checkout@v4
      - name: Require a PS5 launcher eboot
        shell: bash
        run: |
          if [ ! -s assets/astro/eboot.bin ]; then
            echo "::error::Add a compatible web-launcher eboot.bin at assets/astro/eboot.bin, then run this workflow again."
            exit 1
          fi
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned PS5 package builder
        run: |
          git clone --filter=blob:none https://github.com/SvenGDK/LibProsperoPKG.git "$GITHUB_WORKSPACE/LibProsperoPKG"
          git -C "$GITHUB_WORKSPACE/LibProsperoPKG" checkout 748eabf1b7d17819528cabf367d8e27109d8fce3
      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          deeplink="https://cdn.jsdelivr.net/gh/henriquerogamer-cell/astro-jailbreak@${GITHUB_SHA}/index.html"
          dotnet run --configuration Release --project tools/pkg-builder/AstroPkgBuilder.csproj -- "$GITHUB_WORKSPACE/assets/astro/eboot.bin" "$GITHUB_WORKSPACE/dist" "$deeplink" "$GITHUB_WORKSPACE/assets/astro"
          test -s dist/ASTRO-Jailbreak.pkg
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Jailbreak-pkg
          path: dist/ASTRO-Jailbreak.pkg
          if-no-files-found: error
          retention-days: 30
