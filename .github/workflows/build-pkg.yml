name: Build ASTRO-Jailbreak.pkg

on:
  workflow_dispatch:
  push:
    branches:
      - dev/astro-jailbreak

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout ASTRO source and artwork
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch and extract the public WebSrv launcher eboot
        shell: bash
        run: |
          set -euo pipefail
          launcher="$RUNNER_TEMP/websrv-launcher.pkg"
          tool_src="$RUNNER_TEMP/ps5-ultrapack"
          tool_out="$RUNNER_TEMP/pkgtool"
          extracted="$RUNNER_TEMP/websrv-extracted"

          curl --fail --location --retry 3 --output "$launcher" \
            "https://raw.githubusercontent.com/ps5-payload-dev/websrv/bc336a9e61cc5a23dd8f71f5156b79c04d4f71f7/homebrew/IV9999-FAKE00000_00-HOMEBREWLOADER01.pkg"

          git clone --filter=blob:none https://github.com/knutwurst/ps5-ultrapack.git "$tool_src"
          git -C "$tool_src" checkout 32d776f9a5f54166845d4b8e2cb90bb380a00725

          dotnet publish "$tool_src/backend/native/src/ffpfsc-pkg-tool/PkgTool.csproj" \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:RuntimeIdentifier=linux-x64 -p:SelfContained=true \
            --output "$tool_out"

          "$tool_out/ffpfsc-pkg-tool" list-inner "$launcher" > "$RUNNER_TEMP/websrv-listing.json"
          python3 - "$RUNNER_TEMP/websrv-listing.json" "$RUNNER_TEMP/eboot-members.txt" <<'PY'
          import json
          import sys
          listing_path, members_path = sys.argv[1:]
          data = json.load(open(listing_path, encoding="utf-8"))
          paths = [entry["path"] for entry in data.get("entries", [])
                   if entry.get("type") != "dir" and entry.get("path", "").lower().endswith("eboot.bin")]
          if not paths:
              raise SystemExit("No eboot.bin entry in public WebSrv launcher PKG: " + json.dumps(data))
          path = paths[0].lstrip("/")
          print("Using launcher executable:", path)
          open(members_path, "w", encoding="utf-8").write(path + "\n")
          PY

          "$tool_out/ffpfsc-pkg-tool" extract-inner "$launcher" "$extracted" \
            --members "$RUNNER_TEMP/eboot-members.txt"

          eboot_path="$(find "$extracted" -type f -iname eboot.bin -print -quit)"
          test -n "$eboot_path"
          install -D "$eboot_path" "$GITHUB_WORKSPACE/assets/astro/eboot.bin"
          test -s "$GITHUB_WORKSPACE/assets/astro/eboot.bin"
          sha256sum "$GITHUB_WORKSPACE/assets/astro/eboot.bin"

      - name: Require a PS5 launcher eboot
        shell: bash
        run: |
          if [ ! -s assets/astro/eboot.bin ]; then
            echo "::error::The WebSrv launcher eboot could not be extracted."
            exit 1
          fi

      - name: Fetch pinned PS5 package builder
        run: |
          git clone --filter=blob:none https://github.com/SvenGDK/LibProsperoPKG.git "$GITHUB_WORKSPACE/LibProsperoPKG"
          git -C "$GITHUB_WORKSPACE/LibProsperoPKG" checkout 748eabf1b7d17819528cabf367d8e27109d8fce3

      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          deeplink="https://cdn.jsdelivr.net/gh/henriquerogamer-cell/astro-jailbreak@${GITHUB_SHA}/index.html"
          dotnet run --configuration Release --project tools/pkg-builder/AstroPkgBuilder.csproj -- "$GITHUB_WORKSPACE/assets/astro/eboot.bin" "$GITHUB_WORKSPACE/dist" "$deeplink" "$GITHUB_WORKSPACE/assets/astro"
          test -s dist/ASTRO-Jailbreak.pkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Jailbreak-pkg
          path: dist/ASTRO-Jailbreak.pkg
          if-no-files-found: error
          retention-days: 30
