name: Build ASTRO-Jailbreak.pkg

on:
  workflow_dispatch:
  push:
    branches:
      - dev/astro-jailbreak

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ASTRO source and artwork
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build a PS5-native eboot from public source
        shell: bash
        run: |
          set -euo pipefail
          native_src="$RUNNER_TEMP/ps5-native-app-boilerplate"
          native_out="$RUNNER_TEMP/astro-native"
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 make ninja-build ccache pkg-config tar unzip wget
          git clone --filter=blob:none https://github.com/blackbearreloaded/ps5-native-app-boilerplate.git "$native_src"
          git -C "$native_src" checkout 38c68b4645ab6a1470c7598df1a3fc10d3e0cae0
          make -C "$native_src" init TITLE_ID=PPSA99998 APP_NAME="ASTRO Launcher"
          make -C "$native_src" app
          mkdir -p "$native_out/sce_module"
          cp "$native_src/build/eboot.elf" "$native_out/eboot.bin"
          cp "$native_src/dist/PPSA99998/sce_module/libc.prx" "$native_out/sce_module/libc.prx"
          test -s "$native_out/eboot.bin"
          test -s "$native_out/sce_module/libc.prx"
          file "$native_out/eboot.bin"
          sha256sum "$native_out/eboot.bin"

      - name: Require generated PS5 eboot
        shell: bash
        run: |
          if [ ! -s "$RUNNER_TEMP/astro-native/eboot.bin" ]; then
            echo "::error::The public PS5 native-app build did not produce eboot.bin."
            exit 1
          fi
      - name: Fetch pinned PS5 package builder
        run: |
          git clone --filter=blob:none https://github.com/SvenGDK/LibProsperoPKG.git "$GITHUB_WORKSPACE/LibProsperoPKG"
          git -C "$GITHUB_WORKSPACE/LibProsperoPKG" checkout 748eabf1b7d17819528cabf367d8e27109d8fce3

      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          deeplink="https://cdn.jsdelivr.net/gh/henriquerogamer-cell/astro-jailbreak@${GITHUB_SHA}/index.html"
          dotnet run --configuration Release --project tools/pkg-builder/AstroPkgBuilder.csproj -- "$RUNNER_TEMP/astro-native/eboot.bin" "$GITHUB_WORKSPACE/dist" "$deeplink" "$GITHUB_WORKSPACE/assets/astro"
          test -s dist/ASTRO-Jailbreak.pkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Jailbreak-pkg
          path: dist/ASTRO-Jailbreak.pkg
          if-no-files-found: error
          retention-days: 30
